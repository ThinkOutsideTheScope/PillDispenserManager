name: PillDispenserManager

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  PillDispenserManager:
    type: application
    platform: iOS
    sources:
      - PillDispenserManager
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.PillDispenserManager
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      testTargets:
        - PillDispenserManagerTests

  PillDispenserManagerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PillDispenserManagerTests
    dependencies:
      - target: PillDispenserManager
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.PillDispenserManagerTests
        GENERATE_INFOPLIST_FILE: YES